name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show SDK
        shell: pwsh
        run: dotnet --info

      - name: Verify repository safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-RepositorySafety.ps1

      - name: Verify V1.0 normal CI contract
        shell: pwsh
        run: node scripts/Verify-V10NormalCiContract.mjs

      - name: Verify V1.0 project version
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V10Version.ps1 -ExpectedTag v1.0.0

      - name: Verify V1.0 version mismatch is rejected
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File scripts/Verify-V10Version.ps1 -ExpectedTag v1.0.1 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Expected mismatched tag v1.0.1 to be rejected."
          }
          $text = $output | Out-String
          if ($text -notmatch "does not match project version") {
            throw "Version mismatch failed for an unexpected reason: $text"
          }
          Write-Host "Mismatched release tag correctly rejected."
          exit 0

      - name: Verify V1.0 production UI contract
        shell: pwsh
        run: node scripts/Verify-V10UiContract.mjs

      - name: Verify V1.0 release asset scripts
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("cbm-v10-assets-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $valid = Join-Path $root "valid"
            New-Item -ItemType Directory -Path $valid | Out-Null
            $validExe = Join-Path $valid "ChromeBookmarksManager.exe"
            Set-Content -LiteralPath $validExe -Value "synthetic-exe" -Encoding ascii
            pwsh -NoProfile -File scripts/New-V10ReleaseChecksum.ps1 -ExecutablePath $validExe
            if ($LASTEXITCODE -ne 0) { throw "Checksum generation failed." }
            pwsh -NoProfile -File scripts/Verify-V10ReleaseAssets.ps1 -ReleaseDirectory $valid
            if ($LASTEXITCODE -ne 0) { throw "Valid release asset pair was rejected." }

            $tampered = Join-Path $root "tampered"
            Copy-Item -LiteralPath $valid -Destination $tampered -Recurse
            Add-Content -LiteralPath (Join-Path $tampered "ChromeBookmarksManager.exe") -Value "tampered"
            $tamperedOutput = & pwsh -NoProfile -File scripts/Verify-V10ReleaseAssets.ps1 -ReleaseDirectory $tampered 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Tampered EXE was not rejected." }
            if (($tamperedOutput | Out-String) -notmatch "SHA256") {
              throw "Tampered EXE failed for an unexpected reason."
            }

            $extra = Join-Path $root "extra"
            Copy-Item -LiteralPath $valid -Destination $extra -Recurse
            Set-Content -LiteralPath (Join-Path $extra "unexpected.txt") -Value "unexpected" -Encoding ascii
            $extraOutput = & pwsh -NoProfile -File scripts/Verify-V10ReleaseAssets.ps1 -ReleaseDirectory $extra 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Unexpected extra asset was not rejected." }
            if (($extraOutput | Out-String) -notmatch "exactly two files|unexpected asset set") {
              throw "Extra asset failed for an unexpected reason."
            }

            Write-Host "V1.0 release asset script self-test passed."
            exit 0
          }
          finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify V1.0 release measurement contract
        shell: pwsh
        run: node scripts/Verify-V10ReleaseMeasurementsContract.mjs

      - name: Smoke V1.0 release measurement runner
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-V10ReleaseMeasurements.ps1 -UrlCount 10000 -FolderCount 1000 -HistoryEditCount 1000

      - name: Smoke V1.0 release readiness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-V10ReleaseReadiness.ps1 -UrlCount 10000 -FolderCount 1000 -HistoryEditCount 1000

      - name: Restore
        shell: pwsh
        run: dotnet restore ChromeBookmarksManager.slnx

      - name: Build
        shell: pwsh
        run: dotnet build ChromeBookmarksManager.slnx --configuration Release --no-restore

      - name: Verify Chrome Bookmarks reader
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=ReaderScale" --logger "console;verbosity=normal"

      - name: Verify browser virtualization
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-BrowserVirtualization.ps1

      - name: Verify search UI contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-SearchUi.ps1

      - name: Verify V0.5 editing UI contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V05EditingUi.ps1

      - name: Verify V0.6 Move UI contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V06MoveUi.ps1

      - name: Verify V0.7 Delete/Batch UI contract
        shell: pwsh
        run: node scripts/Verify-V07DeleteUi.mjs

      - name: Verify V0.8 Undo/Redo UI contract
        shell: pwsh
        run: node scripts/Verify-V08UndoRedoUi.mjs

      - name: Verify V0.9 Save UI contract
        shell: pwsh
        run: node scripts/Verify-V09SaveUi.mjs

      - name: Verify V0.6 bookmark Drag & Drop contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V06BookmarkDragDrop.ps1

      - name: Verify V0.6 folder Drag & Drop contract
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V06FolderDragDrop.ps1

      - name: Verify V0.6 move safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V06MoveSafety.ps1

      - name: Verify V0.7 delete safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V07DeleteSafety.ps1

      - name: Verify V0.8 Undo/Redo safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V08UndoRedoSafety.ps1

      - name: Verify V0.9 persistence safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V09WriteSafety.ps1

      - name: Verify V0.9 Task 12 helper syntax
        shell: pwsh
        run: |
          $source = Get-Content scripts/V09-Task12DisposableProfile.ps1 -Raw -Encoding UTF8
          [void][scriptblock]::Create($source)

      - name: Verify V0.9 Task 13 helper syntax
        shell: pwsh
        run: |
          $source = Get-Content scripts/V09-Task13ProductionAcceptance.ps1 -Raw -Encoding UTF8
          [void][scriptblock]::Create($source)

      - name: Verify browser scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=BrowserScale" --logger "console;verbosity=normal"

      - name: Verify search scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=SearchScale" --logger "console;verbosity=normal"

      - name: Verify V0.6 move scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=MoveScale" --logger "console;verbosity=normal"

      - name: Verify V0.7 delete batch scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=DeleteBatchScale" --logger "console;verbosity=normal"

      - name: Verify V0.8 Undo/Redo scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=UndoRedoScale" --logger "console;verbosity=normal"

      - name: Verify V0.9 write scale
        shell: pwsh
        run: dotnet test tests/ChromeBookmarksManager.Tests/ChromeBookmarksManager.Tests.csproj --configuration Release --no-build --filter "Category=WriteScale" --logger "console;verbosity=normal"

      - name: Test
        shell: pwsh
        run: dotnet test ChromeBookmarksManager.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish Windows x64
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Publish-Windows.ps1

      - name: Verify single-file output
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-SingleFilePublish.ps1 -PublishDirectory artifacts/win-x64

      - name: Smoke test executable
        shell: pwsh
        run: pwsh -NoProfile -File scripts/SmokeTest-Windows.ps1 -ExecutablePath artifacts/win-x64/ChromeBookmarksManager.exe

      - name: Package V0.9 owner acceptance kit
        shell: pwsh
        run: |
          Copy-Item scripts/V09-Task12DisposableProfile.ps1 artifacts/win-x64/V09-Task12DisposableProfile.ps1
          Copy-Item docs/superpowers/V09-TASK12-OWNER-GUIDE.txt artifacts/win-x64/V09-TASK12-OWNER-GUIDE.txt
          Copy-Item scripts/V09-Task13ProductionAcceptance.ps1 artifacts/win-x64/V09-Task13ProductionAcceptance.ps1
          Copy-Item docs/superpowers/V09-TASK13-OWNER-GUIDE.txt artifacts/win-x64/V09-TASK13-OWNER-GUIDE.txt

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: ChromeBookmarksManager-win-x64
          path: artifacts/win-x64/*
          if-no-files-found: error
          retention-days: 1
