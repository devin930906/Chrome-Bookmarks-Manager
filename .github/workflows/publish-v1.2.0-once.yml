name: Publish V1.2.0 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.2.0-once.yml'

permissions:
  contents: write

jobs:
  publish-v1-2-0:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.2.0
      TARGET_SHA: a10f4cb69771d1372c407626cc53d2cdcf560ebb

    steps:
      - name: Checkout validated release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify exact release source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:TARGET_SHA) {
            throw "Release checkout '$actual' does not match approved target '$env:TARGET_SHA'."
          }
          Write-Host "Approved release source verified: $actual"

      - name: Verify tag and project version
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V10Version.ps1 -ExpectedTag "${{ env.RELEASE_TAG }}"

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$env:RELEASE_TAG" *> $null
          $releaseViewExitCode = $LASTEXITCODE
          if ($releaseViewExitCode -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }
          if ($releaseViewExitCode -ne 1) {
            throw "Could not determine release state. gh exit code: $releaseViewExitCode"
          }
          Write-Host "Release $env:RELEASE_TAG does not exist yet."

      - name: Run full release readiness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-V10ReleaseReadiness.ps1

      - name: Verify final release assets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V10ReleaseAssets.ps1 -ReleaseDirectory artifacts/win-x64

      - name: Create v1.2.0 tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/win-x64/ChromeBookmarksManager.exe" `
            "artifacts/win-x64/ChromeBookmarksManager.exe.sha256" `
            --target "$env:TARGET_SHA" `
            --title "Chrome Bookmarks Manager $env:RELEASE_TAG" `
            --notes-file "docs/releases/v1.2.0.md"

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,url,targetCommitish
