name: Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semantic release tag, for example v1.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }
          else {
            $tag = "${{ github.ref_name }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag could not be resolved."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Validate tag and project version
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V10Version.ps1 -ExpectedTag "$env:RELEASE_TAG"

      - name: Run release readiness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-V10ReleaseReadiness.ps1

      - name: Verify final release assets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Verify-V10ReleaseAssets.ps1 -ReleaseDirectory artifacts/win-x64

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "release",
            "create",
            "$env:RELEASE_TAG",
            "artifacts/win-x64/ChromeBookmarksManager.exe",
            "artifacts/win-x64/ChromeBookmarksManager.exe.sha256",
            "--title",
            "Chrome Bookmarks Manager $env:RELEASE_TAG",
            "--notes-file",
            "docs/releases/$env:RELEASE_TAG.md"
          )

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $arguments += @("--target", "${{ github.sha }}")
          }
          else {
            $arguments += "--verify-tag"
          }

          gh @arguments
